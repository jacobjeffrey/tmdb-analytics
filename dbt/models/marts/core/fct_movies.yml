# fct_movies.yml

version: 2

models:
  - name: fct_movies
    description: Fact table for movies. One row per movie.
    columns:
      - name: movie_id
        description: Unique identifier for the movie
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_movies')
                field: movie_id

      - name: revenue_usd
        description: The revenue in USD, not adjusted for inflation, with TMDB zero values normalized to null.
        tests:
          - dbt_utils.expression_is_true:
              expression: "is null or revenue_usd >= 0"

      - name: budget_usd
        description: The budget in USD, not adjusted for inflation, with TMDB zero values normalized to null.
        tests:
          - dbt_utils.expression_is_true:
              expression: "is null or budget_usd >= 0"

      - name: budget_quality
        description: Quality flag for budget reporting.
        tests:
          - accepted_values:
              values: ['missing', 'unreliable_low', 'reported']

      - name: budget_tier
        description: Budget tier derived from reported quartiles.
        tests:
          - accepted_values:
              values: ['low', 'mid', 'high']
              where: "budget_tier is not null"

      - name: runtime
        description: The movie runtime in minutes
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000
              config:
                severity: warn

      - name: popularity
        description: TMDB popularity score, a weighted engagement metric.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: vote_average
        description: Average user rating (0–10 scale).
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10

      - name: vote_count
        description: Number of user votes recorded.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
