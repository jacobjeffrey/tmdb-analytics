# presentation.yml

version: 2

models:
  - name: rpt_top_roi_movies_by_budget_tier_last_5y
    description: Top 5 ROI movies per budget tier released in the last 5 years.
    columns:
      - name: roi
        description: Revenue divided by budget.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or budget_usd is null"
  - name: rpt_genre_count_last_5y
    description: Movie counts per genre for releases in the last 5 years.
    columns:
      - name: release_year
        description: Release year for aggregation.
      - name: genre_id
        description: Genre identifier.
      - name: genre_name
        description: Genre name.
      - name: movie_count_last_5y
        description: Count of distinct movies released in the last 5 years.
